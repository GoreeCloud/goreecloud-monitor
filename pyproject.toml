[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-monitor"
version = "0.1.0"
description = "GoreeCloud-native availability and endpoint monitoring"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
dependencies = [
  "Django==5.2.17",
  "httpx==0.28.1",
  "dnspython==2.8.0",
  "psycopg[binary]==3.3.4",
  "gunicorn==26.0.0",
  "whitenoise==6.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
