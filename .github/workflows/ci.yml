name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: SQLite source tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Django system checks
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only
        run: python manage.py check
      - name: Migration drift
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only
          MANAGER_API_TOKEN: ci-manager-token
        run: python manage.py test -v 2
      - name: Production static asset build
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-production-key-not-used-outside-ci-2026-ABCDEFGHIJKLMNOPQRSTUVWXYZ-0123456789
          DJANGO_ALLOWED_HOSTS: monitor.example.invalid
        run: python manage.py collectstatic --noinput
      - name: Deployment security checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-production-key-not-used-outside-ci-2026-ABCDEFGHIJKLMNOPQRSTUVWXYZ-0123456789
          DJANGO_ALLOWED_HOSTS: monitor.example.invalid
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy

  postgres-tests:
    name: PostgreSQL 17 tests and recovery proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: goreecloud_monitor
          POSTGRES_USER: goreecloud_monitor
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goreecloud_monitor -d goreecloud_monitor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only
      DATABASE_ENGINE: postgres
      POSTGRES_DB: goreecloud_monitor
      POSTGRES_USER: goreecloud_monitor
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      MANAGER_API_TOKEN: ci-manager-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput
      - name: Run tests on PostgreSQL
        run: python manage.py test -v 2
      - name: Seed database recovery proof
        run: >-
          python manage.py shell -c
          "from monitoring.models import Monitor; Monitor.objects.update_or_create(name='restore-proof', defaults={'kind':'PUSH','interval_seconds':60})"
      - name: Production-style target preflight against PostgreSQL
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-production-key-not-used-outside-ci-2026-ABCDEFGHIJKLMNOPQRSTUVWXYZ-0123456789
          DJANGO_ALLOWED_HOSTS: monitor.example.invalid
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          MONITOR_ALLOWED_NETWORKS: 10.20.30.0/24,fd00:1234::/64
          NTFY_BASE_URL: http://ntfy:80
          NTFY_TOPIC: goreecloud-uptime
          NTFY_TOKEN: ci-write-only-publisher-token
          MANAGER_API_TOKEN: ci-manager-token
        run: python manage.py targetpreflight --json
      - name: Create logical PostgreSQL backup
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=ci-postgres-password
          -v "$RUNNER_TEMP:/backup"
          postgres:17.10-bookworm
          pg_dump -h 127.0.0.1 -U goreecloud_monitor -Fc -f /backup/monitor.dump goreecloud_monitor
      - name: Restore backup into empty PostgreSQL database
        run: |
          docker run --rm --network host -e PGPASSWORD=ci-postgres-password postgres:17.10-bookworm createdb -h 127.0.0.1 -U goreecloud_monitor goreecloud_monitor_restore
          docker run --rm --network host -e PGPASSWORD=ci-postgres-password -v "$RUNNER_TEMP:/backup" postgres:17.10-bookworm pg_restore --no-owner --no-privileges -h 127.0.0.1 -U goreecloud_monitor -d goreecloud_monitor_restore /backup/monitor.dump
      - name: Verify restored state through Django
        env:
          POSTGRES_DB: goreecloud_monitor_restore
        run: >-
          python manage.py shell -c
          "from monitoring.models import Monitor; assert Monitor.objects.filter(name='restore-proof', kind='PUSH').exists(); print('PostgreSQL restore verified')"

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Verify installed dependency consistency
        run: pip check
      - name: Fail on known vulnerable Python dependencies
        run: pip-audit -r requirements.txt

  container-build:
    name: Container build, scan, and production smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable Compose environment
        run: cp .env.example .env
      - name: Validate Compose definition
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config --quiet
      - name: Build application image
        run: docker build --pull --tag goreecloud-monitor:ci .
      - name: Verify application image runs as non-root monitor user
        run: test "$(docker image inspect goreecloud-monitor:ci --format '{{.Config.User}}')" = "monitor"
      - name: Verify runtime image excludes development and secret-bearing files
        run: >-
          docker run --rm --entrypoint sh goreecloud-monitor:ci -c
          'test ! -e /app/.env && test ! -d /app/.git && test ! -d /app/tests && ! command -v pip'
      - name: Scan image for fixed HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goreecloud-monitor:ci
          version: v0.74.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Run production-mode container smoke check
        run: >-
          docker run --rm
          -e DJANGO_DEBUG=false
          -e DJANGO_SECRET_KEY=ci-production-key-not-used-outside-ci-2026-ABCDEFGHIJKLMNOPQRSTUVWXYZ-0123456789
          -e DJANGO_ALLOWED_HOSTS=monitor.example.invalid
          -e DJANGO_SECURE_SSL_REDIRECT=true
          -e DJANGO_HSTS_SECONDS=31536000
          -e DATABASE_ENGINE=sqlite
          goreecloud-monitor:ci
          python manage.py check --deploy

  production-topology:
    name: Disposable production topology
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build traceable application image
        run: docker build --pull --tag goreecloud-monitor:deployment-ci .
      - name: Resolve exact PostgreSQL image digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17.10-bookworm
          repo_digest="$(docker image inspect postgres:17.10-bookworm --format '{{index .RepoDigests 0}}')"
          digest="${repo_digest#*@}"
          test "$digest" != "$repo_digest"
          echo "POSTGRES_IMAGE=postgres:17.10-bookworm@$digest" >> "$GITHUB_ENV"
      - name: Prepare isolated production configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goreecloud-monitor-db"
          cat > "$RUNNER_TEMP/database.env" <<'EOF'
          POSTGRES_DB=goreecloud_monitor
          POSTGRES_USER=goreecloud_monitor
          POSTGRES_PASSWORD=ci-production-database-password
          POSTGRES_PORT=5432
          EOF
          cat > "$RUNNER_TEMP/monitor.env" <<'EOF'
          DJANGO_DEBUG=false
          DJANGO_SECRET_KEY=ci-production-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS=monitor.example.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS=https://monitor.example.invalid
          DJANGO_SECURE_SSL_REDIRECT=true
          DJANGO_HSTS_SECONDS=31536000
          MONITOR_MAX_CONCURRENCY=4
          MONITOR_MAX_RESPONSE_BYTES=1048576
          MONITOR_CHECK_RETENTION_DAYS=30
          MONITOR_POLL_SECONDS=1
          MONITOR_ALLOW_PUBLIC_TARGETS=true
          MONITOR_ALLOWED_NETWORKS=127.0.0.0/8,::1/128
          MANAGER_API_TOKEN=
          NTFY_BASE_URL=
          NTFY_TOPIC=
          NTFY_TOKEN=
          EOF
          echo "GOREECLOUD_MONITOR_IMAGE=goreecloud-monitor:deployment-ci" >> "$GITHUB_ENV"
          echo "MONITOR_DB_ENV_FILE=$RUNNER_TEMP/database.env" >> "$GITHUB_ENV"
          echo "MONITOR_APP_ENV_FILE=$RUNNER_TEMP/monitor.env" >> "$GITHUB_ENV"
          echo "MONITOR_DATABASE_PATH=$RUNNER_TEMP/goreecloud-monitor-db" >> "$GITHUB_ENV"
          echo "CADDY_NETWORK=goreecloud-monitor-ci-proxy" >> "$GITHUB_ENV"
      - name: Create disposable external proxy network
        run: docker network create goreecloud-monitor-ci-proxy
      - name: Validate resolved production Compose contract
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.production.yml config --format json > "$RUNNER_TEMP/production-compose.json"
          python scripts/validate_production_compose.py < "$RUNNER_TEMP/production-compose.json"
      - name: Start disposable production topology
        run: docker compose -f compose.production.yml up -d
      - name: Verify long-running production services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            web_id="$(docker compose -f compose.production.yml ps -q web)"
            worker_id="$(docker compose -f compose.production.yml ps -q worker)"
            db_id="$(docker compose -f compose.production.yml ps -q db)"
            if [ -n "$web_id" ] && [ -n "$worker_id" ] && [ -n "$db_id" ]; then
              web_health="$(docker inspect "$web_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
              if [ "$web_health" = "healthy" ] && [ "$(docker inspect "$worker_id" --format '{{.State.Running}}')" = "true" ] && [ "$(docker inspect "$db_id" --format '{{.State.Running}}')" = "true" ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f compose.production.yml ps
              docker compose -f compose.production.yml logs --no-color
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect "$web_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect "$worker_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect "$web_id" --format '{{.Config.User}}')" = "monitor"
          test "$(docker inspect "$worker_id" --format '{{.Config.User}}')" = "monitor"
          test -z "$(docker port "$web_id")"
          test -z "$(docker port "$worker_id")"
          test -z "$(docker port "$db_id")"
      - name: Run target preflight inside disposable production web container
        run: docker compose -f compose.production.yml exec -T web python manage.py targetpreflight --json
      - name: Verify one-shot migration completed successfully
        shell: bash
        run: |
          set -euo pipefail
          migrate_id="$(docker compose -f compose.production.yml ps -a -q migrate)"
          test -n "$migrate_id"
          test "$(docker inspect "$migrate_id" --format '{{.State.ExitCode}}')" = "0"
          test "$(docker inspect "$migrate_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect "$migrate_id" --format '{{.Config.User}}')" = "monitor"
      - name: Tear down disposable production topology
        if: always()
        shell: bash
        run: |
          docker compose -f compose.production.yml down --remove-orphans || true
          docker network rm goreecloud-monitor-ci-proxy 2>/dev/null || true
