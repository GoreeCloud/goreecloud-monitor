name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: SQLite source tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Django system checks
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only
        run: python manage.py check
      - name: Migration drift
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only
          MANAGER_API_TOKEN: ci-manager-token
        run: python manage.py test -v 2
      - name: Production static asset build
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-production-key-not-used-outside-ci
          DJANGO_ALLOWED_HOSTS: monitor.example.invalid
        run: python manage.py collectstatic --noinput
      - name: Deployment security checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-production-key-not-used-outside-ci
          DJANGO_ALLOWED_HOSTS: monitor.example.invalid
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy

  postgres-tests:
    name: PostgreSQL 17 tests and recovery proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: goreecloud_monitor
          POSTGRES_USER: goreecloud_monitor
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goreecloud_monitor -d goreecloud_monitor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only
      DATABASE_ENGINE: postgres
      POSTGRES_DB: goreecloud_monitor
      POSTGRES_USER: goreecloud_monitor
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      MANAGER_API_TOKEN: ci-manager-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput
      - name: Run tests on PostgreSQL
        run: python manage.py test -v 2
      - name: Seed database recovery proof
        run: >-
          python manage.py shell -c
          "from monitoring.models import Monitor; Monitor.objects.update_or_create(name='restore-proof', defaults={'kind':'PUSH','interval_seconds':60})"
      - name: Production-style target preflight against PostgreSQL
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-production-key-not-used-outside-ci-0123456789
          DJANGO_ALLOWED_HOSTS: monitor.example.invalid
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          MONITOR_ALLOWED_NETWORKS: 10.20.30.0/24,fd00:1234::/64
          NTFY_BASE_URL: http://ntfy:80
          NTFY_TOPIC: goreecloud-uptime
          NTFY_TOKEN: ci-write-only-publisher-token
          MANAGER_API_TOKEN: ci-manager-token
        run: python manage.py targetpreflight --json
      - name: Create logical PostgreSQL backup
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=ci-postgres-password
          -v "$RUNNER_TEMP:/backup"
          postgres:17.10-bookworm
          pg_dump -h 127.0.0.1 -U goreecloud_monitor -Fc -f /backup/monitor.dump goreecloud_monitor
      - name: Restore backup into empty PostgreSQL database
        run: |
          docker run --rm --network host -e PGPASSWORD=ci-postgres-password postgres:17.10-bookworm createdb -h 127.0.0.1 -U goreecloud_monitor goreecloud_monitor_restore
          docker run --rm --network host -e PGPASSWORD=ci-postgres-password -v "$RUNNER_TEMP:/backup" postgres:17.10-bookworm pg_restore --no-owner --no-privileges -h 127.0.0.1 -U goreecloud_monitor -d goreecloud_monitor_restore /backup/monitor.dump
      - name: Verify restored state through Django
        env:
          POSTGRES_DB: goreecloud_monitor_restore
        run: >-
          python manage.py shell -c
          "from monitoring.models import Monitor; assert Monitor.objects.filter(name='restore-proof', kind='PUSH').exists(); print('PostgreSQL restore verified')"

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Verify installed dependency consistency
        run: pip check
      - name: Fail on known vulnerable Python dependencies
        run: pip-audit -r requirements.txt

  container-build:
    name: Container build, scan, and production smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable Compose environment
        run: cp .env.example .env
      - name: Validate Compose definition
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose config --quiet
      - name: Build application image
        run: docker build --pull --tag goreecloud-monitor:ci .
      - name: Verify runtime image excludes development and secret-bearing files
        run: >-
          docker run --rm --entrypoint sh goreecloud-monitor:ci -c
          'test ! -e /app/.env && test ! -d /app/.git && test ! -d /app/tests && ! command -v pip'
      - name: Scan image for fixed HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goreecloud-monitor:ci
          version: v0.74.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Run production-mode container smoke check
        run: >-
          docker run --rm
          -e DJANGO_DEBUG=false
          -e DJANGO_SECRET_KEY=ci-production-key-not-used-outside-ci
          -e DJANGO_ALLOWED_HOSTS=monitor.example.invalid
          -e DJANGO_SECURE_SSL_REDIRECT=true
          -e DJANGO_HSTS_SECONDS=31536000
          -e DATABASE_ENGINE=sqlite
          goreecloud-monitor:ci
          python manage.py check --deploy
