name: Rollback compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  immediate-predecessor:
    name: Immediate predecessor database compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: goreecloud_monitor
          POSTGRES_USER: goreecloud_monitor
          POSTGRES_PASSWORD: ci-rollback-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goreecloud_monitor -d goreecloud_monitor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PREVIOUS_CANDIDATE: 89e15b82eba893b5ae1841487c80f2c8a63352d5
    steps:
      - name: Checkout Monitor candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immediate predecessor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PREVIOUS_CANDIDATE }}
          path: previous
      - name: Require unchanged migration chain
        shell: bash
        run: |
          set -euo pipefail
          test -f previous/src/monitoring/migrations/0005_job_event_idempotency.py
          test -f src/monitoring/migrations/0005_job_event_idempotency.py
          diff -ru previous/src/monitoring/migrations src/monitoring/migrations
      - name: Build predecessor and candidate images
        run: |
          docker build --tag goreecloud-monitor:rollback-previous previous
          docker build --tag goreecloud-monitor:rollback-candidate .
      - name: Apply predecessor schema and seed retained and expired history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DJANGO_DEBUG=true \
            -e DJANGO_SECRET_KEY=ci-rollback-only \
            -e DATABASE_ENGINE=postgres \
            -e POSTGRES_DB=goreecloud_monitor \
            -e POSTGRES_USER=goreecloud_monitor \
            -e POSTGRES_PASSWORD=ci-rollback-password \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            goreecloud-monitor:rollback-previous \
            python manage.py migrate --noinput
          docker run --rm --network host \
            -e DJANGO_DEBUG=true \
            -e DJANGO_SECRET_KEY=ci-rollback-only \
            -e DATABASE_ENGINE=postgres \
            -e POSTGRES_DB=goreecloud_monitor \
            -e POSTGRES_USER=goreecloud_monitor \
            -e POSTGRES_PASSWORD=ci-rollback-password \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            goreecloud-monitor:rollback-previous \
            python manage.py shell -c \
            "from datetime import timedelta; from django.utils import timezone; from monitoring.models import CheckResult, JobEvent, Monitor, NotificationOutbox; now=timezone.now(); p=Monitor.objects.create(name='rollback-proof',kind='PUSH',interval_seconds=60,failure_threshold=1); ping=Monitor.objects.create(name='ping-rollback-proof',kind='PING',target='127.0.0.1',enabled=False,timeout_seconds=3); assert ping.state == 'PAUSED'; j=Monitor.objects.create(name='job-retention-proof',kind='JOB',interval_seconds=3600,job_grace_seconds=60); CheckResult.objects.create(monitor=p,checked_at=now-timedelta(days=31),success=True,observed_state='UP',message='expired-check'); CheckResult.objects.create(monitor=p,checked_at=now-timedelta(days=1),success=True,observed_state='UP',message='recent-check'); JobEvent.objects.create(monitor=j,received_at=now-timedelta(days=120),event_type='FAILURE',run_id='old-failure',exit_code=1); JobEvent.objects.create(monitor=j,received_at=now-timedelta(days=100),event_type='START',run_id='latest-run'); JobEvent.objects.create(monitor=j,received_at=now-timedelta(days=99),event_type='SUCCESS',event_id='123e4567-e89b-12d3-a456-426614174000',run_id='latest-run',duration_ms=1000); JobEvent.objects.create(monitor=j,received_at=now-timedelta(days=98),event_type='LOG',message='expired-log'); JobEvent.objects.create(monitor=j,received_at=now-timedelta(days=1),event_type='LOG',message='recent-log'); o=NotificationOutbox.objects.create(transition='DOWN',payload={'source':'goreecloud-monitor','channel':'monitoring','title':'Outage','body':'rollback proof','severity':'critical'},idempotency_key='gcm-v1-'+'b'*64); assert o.pk; print('predecessor retention state seeded')"
      - name: Run candidate retention and verify preserved current state
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DJANGO_DEBUG=true \
            -e DJANGO_SECRET_KEY=ci-rollback-only \
            -e DATABASE_ENGINE=postgres \
            -e POSTGRES_DB=goreecloud_monitor \
            -e POSTGRES_USER=goreecloud_monitor \
            -e POSTGRES_PASSWORD=ci-rollback-password \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            goreecloud-monitor:rollback-candidate \
            python manage.py migrate --noinput
          docker run --rm --network host \
            -e DJANGO_DEBUG=true \
            -e DJANGO_SECRET_KEY=ci-rollback-only \
            -e DATABASE_ENGINE=postgres \
            -e POSTGRES_DB=goreecloud_monitor \
            -e POSTGRES_USER=goreecloud_monitor \
            -e POSTGRES_PASSWORD=ci-rollback-password \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            goreecloud-monitor:rollback-candidate \
            python manage.py shell -c \
            "from django.utils import timezone; from monitoring.models import CheckResult, JobEvent, Monitor, NotificationOutbox; from monitoring.retention import prune_monitor_history; result=prune_monitor_history(now=timezone.now(),check_retention_days=30,job_event_retention_days=90); assert result.check_results_deleted == 1; assert result.job_events_deleted == 3; p=Monitor.objects.get(name='rollback-proof'); assert CheckResult.objects.filter(monitor=p,message='recent-check').exists(); assert not CheckResult.objects.filter(monitor=p,message='expired-check').exists(); j=Monitor.objects.get(name='job-retention-proof'); assert JobEvent.objects.filter(monitor=j,event_type='SUCCESS',event_id='123e4567-e89b-12d3-a456-426614174000').exists(); assert JobEvent.objects.filter(monitor=j,message='recent-log').exists(); assert JobEvent.objects.filter(monitor=j).count() == 2; assert NotificationOutbox.objects.filter(idempotency_key='gcm-v1-'+'b'*64).exists(); print('candidate retention behavior verified')"
      - name: Roll application back without schema change
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e DJANGO_DEBUG=true \
            -e DJANGO_SECRET_KEY=ci-rollback-only \
            -e DATABASE_ENGINE=postgres \
            -e POSTGRES_DB=goreecloud_monitor \
            -e POSTGRES_USER=goreecloud_monitor \
            -e POSTGRES_PASSWORD=ci-rollback-password \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            goreecloud-monitor:rollback-previous \
            python manage.py shell -c \
            "from monitoring.models import CheckResult, JobEvent, Monitor, NotificationOutbox; p=Monitor.objects.get(name='rollback-proof'); j=Monitor.objects.get(name='job-retention-proof'); assert CheckResult.objects.filter(monitor=p,message='recent-check').exists(); assert JobEvent.objects.filter(monitor=j,event_type='SUCCESS',event_id='123e4567-e89b-12d3-a456-426614174000').exists(); assert JobEvent.objects.filter(monitor=j,message='recent-log').exists(); assert JobEvent.objects.filter(monitor=j).count() == 2; assert NotificationOutbox.objects.filter(idempotency_key='gcm-v1-'+'b'*64).exists(); print('immediate predecessor reads retained state after source-only rollback')"
