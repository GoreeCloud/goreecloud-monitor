name: Notify producer adapter

on:
  pull_request:
    paths:
      - "services/notify-producer/**"
      - "src/monitoring/notifications.py"
      - "src/monitoring/engine.py"
      - "src/monitoring/preflight.py"
      - "src/goreecloud_monitor/settings.py"
      - "tests/test_notifications.py"
      - "tests/test_engine.py"
      - "tests/test_preflight.py"
      - ".env.example"
      - "deploy/monitor.env.example"
      - "docs/notify-runtime.md"
      - ".github/workflows/notify-producer.yml"
  push:
    branches: [main]
    paths:
      - "services/notify-producer/**"
      - "src/monitoring/notifications.py"
      - "src/monitoring/engine.py"
      - "src/monitoring/preflight.py"
      - "src/goreecloud_monitor/settings.py"
      - "tests/test_notifications.py"
      - "tests/test_engine.py"
      - "tests/test_preflight.py"
      - ".env.example"
      - "deploy/monitor.env.example"
      - "docs/notify-runtime.md"
      - ".github/workflows/notify-producer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@c801f1c14e4b4a733b8d06b697a13ba3c9c122ee # v6.0.0
        with:
          node-version: "22"
      - name: Test source producer adapter
        working-directory: services/notify-producer
        run: npm test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Test runtime producer contract
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only
        run: python manage.py test tests.test_notifications tests.test_engine tests.test_preflight -v 2
