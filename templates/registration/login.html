{% extends "monitoring/base.html" %}
{% block title %}Sign in · GoreeCloud Monitor{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="panel auth-card">
    <div class="eyebrow">Private monitoring</div>
    <h1>Sign in to Monitor</h1>
    <p class="muted">Administrative access is restricted to approved GoreeCloud identities.</p>
    <form method="post" class="form-grid">{% csrf_token %}
      {{ form.as_p }}
      <button class="button primary" type="submit">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}
